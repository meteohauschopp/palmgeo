# ---------------------------------------------------------------------------
# RECORD -- a copy of repository/config/mapping_ni.yml as it stood when this
# driver was built. It documents what was used; it is NOT what a re-run reads.
# Editing this file changes nothing. Edit the original above instead.
# ---------------------------------------------------------------------------
# ==============================================================================
# Semantic mapping: ALKIS / LoD2 / Basis-DLM  ->  PALM surface types
# ==============================================================================
# The second and last region-specific file. Everything here is data, not code.
#
# CORE IDEA -- land USE x land COVER
# ---------------------------------
# ALKIS `nutzung` is a land *use* model: a polygon "41001 Wohnbauflaeche"
# contains roofs, driveways, lawns and trees alike. Mapping it 1:1 onto a PALM
# surface type would therefore be wrong at 1 m resolution. Instead every ALKIS
# class declares what it becomes depending on the land *cover* observed in the
# orthophoto and the nDSM:
#
#   water:      -> unconditionally this water type
#   high_ndvi:  -> NDVI >= ndvi_threshold          (vegetated)
#   low_ndvi:   -> NDVI <  ndvi_threshold          (sealed or bare)
#   high_veg:   -> vegetated AND nDSM >= height_high_vegetation_lower_threshold
#
# Buildings always win (they are burnt in from the cadastre footprints and
# palm_csd enforces building > water > pavement > vegetation on top).
#
# TYPE SYNTAX:  "<group>:<palm_type_name>",  group in {vegetation, pavement, water}
# Names and their valid ranges are taken from palm_csd docs/types.md:
#   vegetation_type 1..18, pavement_type 0..15, water_type 0..5
#
# LOOKUP:  longest matching prefix of the ALKIS `tn` string wins, e.g.
#   "43002 VEG 1100"  ->  entry "43002 VEG 1100"   (Laubholz)
#   "43002 VEG 9999"  ->  entry "43002"            (Wald, generic)
#   "49999"           ->  `fallback` below
# Unmapped keys encountered in the data are reported by `palmgeo report`.
# ==============================================================================

region: NI

# ------------------------------------------------------------------ defaults --
fallback:
  high_ndvi: vegetation:short_grass
  low_ndvi:  vegetation:bare_soil
  high_veg:  vegetation:deciduous_broadleaf_trees

# Used when phenology (two orthophoto epochs) is DISABLED. With phenology
# enabled, `high_veg` is overridden per pixel by the leaf-off/leaf-on NDVI
# pair -- except where a class sets `high_veg_fixed: true`.
# ASSUMPTION: broadleaf deciduous is the most common tall vegetation in NI.
default_high_vegetation: vegetation:deciduous_broadleaf_trees

# What a tree detected by `vegetation.trees.mode: rentz` becomes in palm_csd:
# an index into palm_csd/data/tree_defaults.csv (crown shape, leaf area and
# trunk defaults) plus a species label for trees.gpkg. The detection only
# tells conifer from broadleaf crowns; which species stands for each is the
# region's call. Fir and beech, as in the method palmgeo's detection was
# ported from (see palmgeo/steps/trees.py).
single_trees:
  conifer:   {tree_type: 1,  species: Abies}    # shape 3 (cone)
  broadleaf: {tree_type: 33, species: Fagus}    # shape 1 (sphere)

phenology:
  # Applied only where nDSM >= height_high_vegetation_lower_threshold.
  #   leaf-on high  AND leaf-off high  -> stays green in winter -> conifer
  #   leaf-on high  AND leaf-off low   -> sheds leaves          -> broadleaf
  #   leaf-on high  AND leaf-off mid   -> mixed stand
  evergreen: vegetation:evergreen_needleleaf_trees
  deciduous: vegetation:deciduous_broadleaf_trees
  mixed:     vegetation:mixed_forest_woodland

# --------------------------------------------------- ALKIS tatsaechliche Nutzung
