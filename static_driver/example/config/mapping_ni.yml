# ------------------------------------------------------------- building type --
# PALM only distinguishes residential/office x three construction periods
# (see palm_csd docs/types.md: building_type 1..7).
#
# ASSUMPTION -- neither ALKIS nor LoD2 carries a construction year, so the age
# class cannot be derived from open data. `default_age` is applied to every
# building. Override it per run, or supply your own building-age raster via
# `extra_inputs` in the run config.
building_type:
  default_age: "1951_2000"       # -> residential_1951_2000 / office_1951_2000
  default: residential
  # matched on the leading digits of the ALKIS `gfk` code (longest prefix wins)
  by_gfk:
    "1":    residential          # 1000 Wohngebaeude, 1120/1130 Mischnutzung
    "1210": residential          # land-/forstwirtschaftliches Wohngebaeude
    "2":    office               # 2000 Wirtschaft/Gewerbe, 2100 Industrie
    "2463": office               # Garage
    "3":    office               # 3000 oeffentliche Zwecke, Schulen, Kirchen

# ------------------------------------------------------------------- bridges --
bridges:
  # ALKIS bauwerke_f, field `bwf`
  values: ["1800"]               # Bruecke
  building_type: bridges         # PALM building_type 7

# --------------------------------------------------------------- street type --
# PALM's street_type enum IS the OpenStreetMap `highway` taxonomy. The
# Basis-DLM `WDM` (Widmung) codes below are the closest available equivalent.
#
# Verified against the shipped ver01_l.dbf; the counts are from a 54 346-record
# sample of the 784 664 statewide segments. Any value not listed here is
# reported by `palmgeo report --what street_type` instead of failing silently.
street_type:
  field: WDM
  default: unclassified
  by_value:
    "1301": motorway             # Bundesautobahn          (~2 %)
    "1303": primary              # Bundesstrasse           (~8 %)
    "1305": secondary            # Landesstrasse           (~8 %)
    "1306": tertiary             # Kreisstrasse            (~12 %)
    "1307": residential          # Gemeindestrasse         (~62 %)
    "9997": unclassified         # sonstiges
    "9999": unclassified         # Attribut trifft nicht zu (~8 %)

# --------------------------------------------------------------- soil type ----
# ASSUMPTION -- no open, area-wide soil texture layer is wired in by default.
# PALM's soil_type 1..6 (coarse..organic); palm_csd's own default is 3.
# To use the LBEG BUEK50 instead, add a `soil` source of kind `wfs` to
# sources_ni.yml and set `soil.source: lbeg` in the run config.
soil:
  constant: medium_fine          # = 3
  by_landuse_prefix:             # optional refinement, applied where it matches
    "43005": organic             # Moor
    "43006": organic             # Sumpf
