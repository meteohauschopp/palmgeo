# ---------------------------------------------------------------------------
# palmgeo is usable in two ways, and both are supported on purpose.
#
#   export PYTHONPATH=repository        no install, nothing to keep in sync
#                                       with the checkout; what the README uses
#   pip install -e .                    puts `palmgeo` on the PATH and lets
#                                       other code import it
#
# The first is deliberately kept working: this repository is read as much as it
# is run, and requiring an install before `python -m palmgeo.cli plan` would put
# a step between somebody and the thing they are trying to understand.
# ---------------------------------------------------------------------------
[build-system]
requires = ["setuptools>=77"]  # PEP 639 license fields
build-backend = "setuptools.build_meta"

[project]
name = "palmgeo"
dynamic = ["version"]
description = "PALM static drivers from open geodata: a staged, resumable pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{name = "Jens Hauschopp"}]
keywords = ["PALM", "static driver", "palm_csd", "urban climate", "geodata"]

# Kept identical to requirements.txt, and tools/selftest.py fails if the two
# ever drift -- two dependency lists that disagree is worse than either.
dependencies = [
    "geopandas>=1.0",
    "rasterio>=1.3",
    "shapely>=2.0",
    "pyproj>=3.6",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "PyYAML>=6.0",
    "netCDF4>=1.6",
    "scikit-image>=0.22",
]

[project.optional-dependencies]
# Only the region staging scripts under repository/ports/ need this. The
# pipeline itself downloads through urllib and has no third-party HTTP
# dependency, which is why this is not in the main list.
ports = ["requests>=2.28"]

[project.scripts]
palmgeo = "palmgeo.cli:main"

[tool.setuptools]
package-dir = {"" = "repository"}

[tool.setuptools.packages.find]
where = ["repository"]
include = ["palmgeo*"]

[tool.setuptools.dynamic]
version = {attr = "palmgeo.__version__"}
